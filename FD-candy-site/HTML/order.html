<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Candy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Order Freeze-Dried Candy</h1>
</header>

<nav class="navbar navbar-expand bg-secondary">
    <div class="container">
        <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Shop</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="order.html">Order</a></li>
        </ul>
        <button class="btn btn-light ms-3">
            🛒
        </button>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 slide-in">
            <div class="order-box">

                <form>
                <h4 class="mb-3">Select Your Candy</h4>

                <!-- Candy 1: Skittles with Flavor Dropdown -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="skittles">

                    <label class="form-check-label me-3" for="skittles">
                        Freeze-Dried Skittles
                    </label>

                    <!-- Flavor Dropdown -->
                    <select class="form-select me-2 w-25" name="skittles_flavor">
                        <option value="">Flavor</option>
                        <option>Original</option>
                        <option>Wild Berry</option>
                        <option>Tropical</option>
                    </select>

                    <!-- Quantity -->
                    <input type="number"
                           class="form-control w-25"
                           placeholder="Qty"
                           min="1">
                </div>


                <!-- Candy 2 -->
                <div class="form-check d-flex align-items-center mb-2">
                    <input class="form-check-input me-2" type="checkbox" id="NerdClusters">
                    <label class="form-check-label me-3" for="NerdClusters">
                        Freeze-Dried Nerd Clusters
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>

                <!-- Candy 3 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="Peeps">
                    <label class="form-check-label me-3" for="Peeps">
                        Freeze-Dried Peeps
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                <!-- Candy 4 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="MilkDuds">
                    <label class="form-check-label me-3" for="MilkDuds">
                        Freeze-Dried Milk Duds
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                <!-- Candy 5 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="Airheads">
                    <label class="form-check-label me-3" for="Airheads">
                        Freeze-Dried Airheads
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                <!-- Candy 6 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="LaffyTaffy">
                    <label class="form-check-label me-3" for="LaffyTaffy">
                        Freeze-Dried Laffy-Taffy
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                 <!-- Candy 7 -->
                    <div class="form-check d-flex align-items-cent mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="JollyRanchers">
                    <label class="form-check-label me-3" for="JollyRanchers">
                        Freeze-Dried JollyRanchers
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                    </div>
                    <!-- Candy 8 -->
                    <div class="form-check d-flex align-items-cent mb-3">
                        <input class="form-check-input me-2" type="checkbox" id="VarietyMix">
                        <label class="form-check-label me-3" for="VarietyMix">
                            Freeze-Dried Variety Mix
                        </label>
                        <input type="number" class="form-control w-25"
                               placeholder="Qty" min="1">
                    </div>

                <hr>



                <label>Special Requests:</label>
<br>

                    <!-- Form #1 -->
                    <form>
                        <label>Select Candy:</label>
                        <select class="form-control mb-2" name="candy" required>
                            <option value="" disabled selected>-- Please choose an option --</option>
                            <option>Freeze-Dried Skittles</option>
                            <option>Freeze-Dried Airheads</option>
                            <option>Freeze-Dried Laffy-Taffy</option>
                            <option>Freeze-Dried Jolly Ranchers</option>



                        </select> <form>

                        <div class="row mb-2 align-items-center">
                            <!-- Checkbox -->
                            <div class="col-sm-3 text-end">
                                <label class="form-check-label" for="allOneFlavor">
                                    Select Option:
                                </label>
                            </div>

                            <div class="col-sm-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="allOneFlavor">
                                    <label class="form-check-label" for="allOneFlavor">
                                        All one flavor
                                    </label>
                                </div>
                            </div>

                            <!-- Textbox -->
                            <div class="col-sm-6">
                                <input type="text" class="form-control" placeholder="Specify Flavor">
                            </div>
                        </div>

                        <!-- Smaller helper text -->
                        <div class="row">
                            <div class="col-sm-9 offset-sm-3">
                                <small class="text-muted">
                                    If choosing Skittles, please specify which flavor (original, wild berry, tropical)
                                    and which color.
                                    <br>
                                    Example: <em>Wild berry – all red</em>
                                </small>
                            </div>
                        </div>

                            <!-- Inline CSS -->
                <button style="background-color:#3d405b; color:white;" class="btn">
                    Add to Cart
                </button>
            </form>

        </div>
    </div>
</div>

<footer class="text-center p-3 bg-dark text-white">
    © 2026 Crunchy Galaxy Candy
</footer>

</body>
</html>
