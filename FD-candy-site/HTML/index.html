<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crunchy Galaxy Candy | Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">

    <style>
        .highlight {
            background-color: #8ab581;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Crunchy Galaxy Candy</h1>
    <p>Freeze-Dried Candy That Crunches Out of This World</p>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</header>

<nav class="navbar navbar-expand bg-secondary">
    <div class="container">
        <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Shop</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="contact.html">Order</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4 d-flex justify-content-center">
    <div class="row">
        <div class="col-md-6 highlight fade-in text-center">
            <h2>Try Freeze-Dried Candy!</h2>
            <p>Our candy is light, crunchy, and packed with flavor.</p>

            <!-- Form #1 -->
            <form>
                <label>Select Candy:</label>
                <select class="form-control mb-2" name="candy" required>
                    <option>Freeze-Dried Skittles</option>
                    <option>Freeze-Dried Nerds Clusters</option>
                    <option>Freeze-Dried Peeps</option>
                    <option>Freeze-Dried Milk Duds</option>
                    <option>Freeze-Dried Airheads</option>
                    <option>Freeze-Dried Laffy-Taffy</option>
                </select>

                <input type="number"
                       name="quantity"
                       placeholder="Quantity"
                       class="form-control mb-2"
                       min="1"
                       required>
                <input type="submit" value="Add to Cart" class="btn btn-primary">
            </form>
        </div>

        <div class="col-md-6 text-center">
            <img src="../images/skittles.jpg" alt="Freeze-dried candy">


            <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif"
                 class="img-fluid mt-3"
                 alt="Candy GIF">
        </div>
    </div>
</div>

<footer class="text-center p-3 mt-4 bg-dark text-white">
    © 2026 Crunchy Galaxy Candy
</footer>

</body>
</html>
