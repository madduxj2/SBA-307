<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Candy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Order Freeze-Dried Candy</h1>
</header>

<nav class="navbar navbar-expand bg-secondary">
    <div class="container">
        <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Shop</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="contact.html">Order</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 slide-in">
            <div class="order-box">
                <form>
                <h4 class="mb-3">Select Your Candy</h4>

                <!-- Candy 1: Skittles with Flavor Dropdown -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="skittles">

                    <label class="form-check-label me-3" for="skittles">
                        Freeze-Dried Skittles
                    </label>

                    <!-- Flavor Dropdown -->
                    <select class="form-select me-2 w-25" name="skittles_flavor">
                        <option value="">Flavor</option>
                        <option>Original</option>
                        <option>Wild Berry</option>
                        <option>Tropical</option>
                        <option>Sour</option>
                    </select>

                    <!-- Quantity -->
                    <input type="number"
                           class="form-control w-25"
                           placeholder="Qty"
                           min="1">
                </div>


                <!-- Candy 2 -->
                <div class="form-check d-flex align-items-center mb-2">
                    <input class="form-check-input me-2" type="checkbox" id="NerdClusters">
                    <label class="form-check-label me-3" for="NerdClusters">
                        Freeze-Dried Nerd Clusters
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>

                <!-- Candy 3 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="Peeps">
                    <label class="form-check-label me-3" for="Peeps">
                        Freeze-Dried Peeps
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                <!-- Candy 4 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="MilkDuds">
                    <label class="form-check-label me-3" for="MilkDuds">
                        Freeze-Dried Milk Duds
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                <!-- Candy 5 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="Airheads">
                    <label class="form-check-label me-3" for="Airheads">
                        Freeze-Dried Airheads
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                <!-- Candy 6 -->
                <div class="form-check d-flex align-items-center mb-3">
                    <input class="form-check-input me-2" type="checkbox" id="LaffyTaffy">
                    <label class="form-check-label me-3" for="LaffyTaffy">
                        Freeze-Dried Laffy-Taffy
                    </label>
                    <input type="number" class="form-control w-25"
                           placeholder="Qty" min="1">
                </div>
                <hr>

                <!-- Customer Info -->
                <label>Email:</label>
                <input type="email" class="form-control mb-2" required>

                <label>Special Requests:</label>
                <textarea class="form-control mb-3"></textarea>

                <!-- Inline CSS -->
                <button style="background-color:#3d405b; color:white;" class="btn">
                    Submit Order
                </button>
            </form>

        </div>
    </div>
</div>

<footer class="text-center p-3 bg-dark text-white">
    © 2026 Crunchy Galaxy Candy
</footer>

</body>
</html>
